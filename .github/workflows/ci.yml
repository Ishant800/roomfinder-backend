name: Node CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
           node-version: 22
           cache: npm


      - name: Install dependencies
        run: npm ci
      
      - name: Export All Secrets to Environment
        uses: reedyuk/export-json-to-env-action@v2
        with:
          json: ${{ secrets.APP_SECRETS }}

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test