name: Node CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
           node-version: 22
           cache: npm


      - name: Install dependencies
        run: npm ci
      
      - name: Export All Secrets to Environment
        run: |
          echo '${{ secrets.APP_SECRETS }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_ENV

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test
